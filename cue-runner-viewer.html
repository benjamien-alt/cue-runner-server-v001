<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>CUE RUNNER — Viewer</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Bebas+Neue&family=DM+Sans:wght@600;700;800&display=swap');
:root{
  --bg:#080809;--s1:#0f0f13;--s2:#15151c;--bdr:#2a2a3a;
  --acc:#c8f53a;--warn:#f5a623;--danger:#f53a3a;
  --text:#f0f0fa;--muted:#9090b0;--dim:#5a5a78;
  --regie:#c4affe;--kraan:#7dd8fc;--licht:#fcd34d;--geluid:#6ee7b7;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;overflow-x:hidden;}

/* ── TOP BAR ── */
.topbar{
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;
  padding:10px 16px;background:var(--s1);border-bottom:1px solid var(--bdr);
}
.logo{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:4px;color:var(--acc);}
.conn-group{display:flex;align-items:center;gap:8px;}
.conn-dot{width:8px;height:8px;border-radius:50%;background:var(--dim);transition:background .3s;flex-shrink:0;}
.conn-dot.live  {background:var(--acc);box-shadow:0 0 8px var(--acc);animation:blink 1s infinite;}
.conn-dot.error {background:var(--danger);}
.conn-dot.offline{background:var(--warn);}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.conn-label{font-size:11px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;}
.badge-viewer{font-size:9px;letter-spacing:2px;color:var(--dim);text-transform:uppercase;padding:3px 8px;border:1px solid var(--bdr);border-radius:4px;}
.offline-banner{
  display:none;background:rgba(245,166,35,.15);border-bottom:1px solid rgba(245,166,35,.3);
  padding:6px 16px;font-size:11px;color:var(--warn);letter-spacing:1px;text-align:center;
}
.offline-banner.show{display:block;}

/* ── LAYOUT ── */
.main{display:grid;grid-template-columns:1fr;gap:0;max-width:1400px;margin:0 auto;}
@media(min-width:700px){.main{grid-template-columns:1fr 1fr;}}
@media(min-width:1100px){.main{grid-template-columns:200px 1fr 1fr 220px;}}

/* ── CLOCK ── */
.clock-section{
  grid-column:1/-1;padding:18px 20px 14px;background:var(--s1);
  border-bottom:1px solid var(--bdr);display:flex;align-items:center;gap:20px;flex-wrap:wrap;
}
.clock-group{display:flex;flex-direction:column;gap:2px;}
.clock-lbl{font-size:9px;letter-spacing:3px;color:var(--muted);text-transform:uppercase;font-weight:800;}
#clock{
  font-family:'Share Tech Mono',monospace;font-size:clamp(44px,7vw,76px);
  color:var(--acc);letter-spacing:3px;line-height:1;
  text-shadow:0 0 28px rgba(200,245,58,.3);transition:color .25s;
}
#clock.run{color:#fff;text-shadow:0 0 36px rgba(200,245,58,.5);}
#clock.pau{color:var(--warn);}
#clock.offline{color:var(--warn);animation:clockPulse 1s infinite alternate;}
@keyframes clockPulse{from{opacity:1}to{opacity:.6}}
.status-badge{
  font-size:11px;letter-spacing:2px;text-transform:uppercase;font-weight:800;
  padding:5px 12px;border-radius:6px;background:var(--s2);color:var(--muted);border:1px solid var(--bdr);
  white-space:nowrap;
}
.status-badge.live{background:rgba(200,245,58,.12);color:var(--acc);border-color:var(--acc);}
.status-badge.pau {background:rgba(245,166,35,.12);color:var(--warn);border-color:var(--warn);}
.region-display{
  flex:1;min-width:180px;display:flex;flex-direction:column;gap:4px;
  padding:10px 14px;background:var(--s2);border-radius:8px;border:1px solid var(--bdr);
}
.rd-label{font-size:9px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;font-weight:800;}
.rd-name{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:2px;color:var(--text);line-height:1;}
.rd-next{font-size:11px;color:var(--muted);margin-top:2px;}

/* ── CUE CARDS ── */
.cue-cards{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--bdr);}
@media(min-width:1100px){.cue-cards{grid-column:2/4;grid-row:2;}}
.cue-card{background:var(--s1);padding:16px 18px;display:flex;flex-direction:column;gap:5px;}
.cc-label{font-size:9px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;font-weight:800;}
.cc-type{display:flex;align-items:center;gap:6px;}
.cc-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.cc-name{
  font-family:'Bebas Neue',sans-serif;font-size:clamp(18px,2.5vw,26px);
  letter-spacing:1.5px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.cc-name.active{color:var(--acc);}
.cc-name.next  {color:var(--warn);}
.cc-time{font-family:'Share Tech Mono',monospace;font-size:12px;color:var(--muted);}
.cc-countdown{font-family:'Share Tech Mono',monospace;font-size:22px;color:var(--warn);}
.cc-countdown.hot{color:var(--danger);animation:pulse .5s infinite alternate;}
@keyframes pulse{from{opacity:1}to{opacity:.2}}
.progress-bar{height:3px;background:var(--bdr);border-radius:2px;overflow:hidden;margin-top:3px;}
.progress-fill{height:100%;background:var(--warn);width:0%;transition:width .4s linear;}

/* ── REGIONS ── */
.regions-col{grid-column:1/-1;background:var(--s1);border-top:1px solid var(--bdr);}
@media(min-width:1100px){.regions-col{grid-column:1/2;grid-row:2/4;border-top:none;border-right:1px solid var(--bdr);}}
.panel-hdr{padding:10px 14px;border-bottom:1px solid var(--bdr);}
.panel-hdr-title{font-size:9px;letter-spacing:3px;color:var(--muted);text-transform:uppercase;font-weight:800;}
.region-row{
  display:flex;align-items:center;gap:8px;padding:8px 14px;
  border-bottom:1px solid var(--bdr);border-left:3px solid transparent;
}
.region-row.active{background:rgba(200,245,58,.05);border-left-color:var(--acc);}
.region-row.past  {opacity:.35;}
.rr-bar{width:4px;height:28px;border-radius:2px;flex-shrink:0;}
.rr-body{flex:1;min-width:0;}
.rr-name{font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:1.5px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rr-name.active{color:var(--acc);}
.rr-time{font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--muted);margin-top:1px;}
.rr-prog{height:2px;background:var(--bdr);border-radius:1px;margin-top:3px;overflow:hidden;}
.rr-prog-fill{height:100%;background:var(--acc);transition:width .5s linear;}

/* ── CUE LIST ── */
.cuelist-col{grid-column:1/-1;background:var(--bg);}
@media(min-width:1100px){.cuelist-col{grid-column:4/5;grid-row:2/4;border-left:1px solid var(--bdr);}}
.cue-row{
  display:flex;align-items:center;gap:8px;padding:8px 14px;
  border-bottom:1px solid var(--bdr);border-left:3px solid transparent;font-size:13px;
}
.cue-row.active  {background:rgba(200,245,58,.05);border-left-color:var(--acc);}
.cue-row.upcoming{background:rgba(245,166,35,.04);border-left-color:var(--warn);}
.cue-row.past    {opacity:.3;}
.cr-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.cr-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cr-name.active{color:var(--acc);font-weight:700;}
.cr-time{font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--muted);}

/* ── CONNECTING OVERLAY ── */
.overlay{
  position:fixed;inset:0;background:rgba(8,8,9,.92);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:16px;z-index:100;transition:opacity .4s;
}
.overlay.hidden{opacity:0;pointer-events:none;}
.overlay-icon{font-size:44px;}
.overlay-text{font-size:14px;color:var(--muted);text-align:center;line-height:1.8;}
.overlay-url{font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--acc);margin-top:4px;}
</style>
</head>
<body>

<div class="overlay" id="overlay">
  <div class="overlay-icon">📡</div>
  <div class="overlay-text">
    Verbinding maken met de Cue Runner server…<br>
    <span id="overlayUrl" class="overlay-url"></span>
  </div>
</div>

<div class="offline-banner" id="offlineBanner">
  ⚠ Verbinding verbroken — klok loopt lokaal door. Herverbinden…
</div>

<div class="topbar">
  <div class="logo">CUE RUNNER</div>
  <div class="conn-group">
    <div class="conn-dot" id="connDot"></div>
    <div class="conn-label" id="connLabel">Verbinden…</div>
    <span class="badge-viewer">VIEWER — alleen lezen</span>
  </div>
</div>

<div class="main">
  <div class="clock-section">
    <div class="clock-group">
      <div class="clock-lbl">Timecode</div>
      <div id="clock">00:00:00</div>
    </div>
    <div class="status-badge" id="statusBadge">GESTOPT</div>
    <div class="region-display">
      <div class="rd-label">Huidig deel</div>
      <div class="rd-name" id="rdName">—</div>
      <div class="rd-next" id="rdNext"></div>
    </div>
  </div>
  <div class="cue-cards">
    <div class="cue-card">
      <div class="cc-label">Nu actief</div>
      <div class="cc-type"><div class="cc-dot" id="activeDot"></div></div>
      <div class="cc-name active" id="activeName">—</div>
      <div class="cc-time" id="activeTime"></div>
    </div>
    <div class="cue-card">
      <div class="cc-label">Volgende</div>
      <div class="cc-type"><div class="cc-dot" id="nextDot"></div></div>
      <div class="cc-name next" id="nextName">—</div>
      <div class="cc-time" id="nextTime"></div>
      <div class="cc-countdown" id="countdown">—</div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    </div>
  </div>
  <div class="regions-col">
    <div class="panel-hdr"><div class="panel-hdr-title">Delen</div></div>
    <div id="regionsList"></div>
  </div>
  <div class="cuelist-col">
    <div class="panel-hdr"><div class="panel-hdr-title">Cuelijst</div></div>
    <div id="cueList"></div>
  </div>
</div>

<script>
const TC={regie:'#c4affe',kraan:'#7dd8fc',licht:'#fcd34d',geluid:'#6ee7b7',none:'#5a5a78'};
const pad=n=>String(n).padStart(2,'0');
const fmt=s=>`${pad(Math.floor(s/3600))}:${pad(Math.floor((s%3600)/60))}:${pad(Math.floor(s%60))}`;
const $=id=>document.getElementById(id);

/* ══════════════════════════════════════
   STATE
══════════════════════════════════════ */
let ws=null, pingIv=null;
let lastState=null;           // last received full state
let localElapsed=0;           // local clock that keeps running offline
let localRunning=false;       // is the show playing (locally known)
let localStartedAt=null;      // performance.now() when show started locally
let connectedOnce=false;      // have we ever successfully connected?
let isOnline=false;

/* ══════════════════════════════════════
   DETERMINE SERVER URL AUTOMATICALLY
   Priority: 1) ?server= param, 2) same host (wss://thishost), 3) manual input
══════════════════════════════════════ */
function resolveServerUrl(){
  // 1. Query parameter
  const qp=new URLSearchParams(location.search).get('server');
  if(qp) return qp;
  // 2. Same host — viewer is served from the relay server
  const proto=location.protocol==='https:'?'wss:':'ws:';
  return `${proto}//${location.host}`;
}

const SERVER_URL=resolveServerUrl();
$('overlayUrl').textContent=SERVER_URL;

/* ══════════════════════════════════════
   CONNECTION
══════════════════════════════════════ */
function connect(){
  if(ws){try{ws.close();}catch(e){}}
  if(pingIv){clearInterval(pingIv);pingIv=null;}

  try{ ws=new WebSocket(SERVER_URL); }
  catch(e){ scheduleReconnect(); return; }

  ws.onopen=()=>{
    isOnline=true;
    setConn('live');
    if(connectedOnce){
      // Was offline — hide offline banner immediately
      $('offlineBanner').classList.remove('show');
      $('clock').classList.remove('offline');
    }
    connectedOnce=true;
    $('overlay').classList.add('hidden');

    // Keepalive ping every 20s (Render drops idle after ~55s)
    pingIv=setInterval(()=>{
      if(ws&&ws.readyState===1) try{ws.send('__ping__');}catch(e){}
    },20000);
  };

  ws.onclose=()=>{
    isOnline=false;
    setConn('offline');
    if(pingIv){clearInterval(pingIv);pingIv=null;}
    if(connectedOnce && localRunning){
      // Keep clock running locally, show offline banner
      $('offlineBanner').classList.add('show');
      $('clock').classList.add('offline');
    } else if(!connectedOnce){
      $('overlay').classList.remove('hidden');
    }
    scheduleReconnect();
  };

  ws.onerror=()=>{ isOnline=false; setConn('error'); };

  ws.onmessage=e=>{
    if(e.data==='__pong__') return;
    try{
      const d=JSON.parse(e.data);
      if(d.disconnected){
        setConn('live'); // still on server, broadcaster gone
        $('statusBadge').textContent='APP OFFLINE';
        $('statusBadge').className='status-badge';
        return;
      }
      applyServerState(d);
    }catch(err){}
  };
}

let reconnectTimer=null;
function scheduleReconnect(){
  if(reconnectTimer)clearTimeout(reconnectTimer);
  reconnectTimer=setTimeout(connect,3000);
}

function setConn(s){
  const dot=$('connDot'),lbl=$('connLabel');
  dot.className='conn-dot'+(s==='live'?' live':s==='offline'?' offline':s==='error'?' error':'');
  lbl.textContent=s==='live'?'Verbonden':s==='offline'?'Offline — herverbinden…':s==='error'?'Verbindingsfout':'Verbinden…';
}

/* ══════════════════════════════════════
   APPLY SERVER STATE
══════════════════════════════════════ */
function applyServerState(s){
  lastState=s;

  // Sync local clock to server
  localElapsed=s.t||0;
  localRunning=s.running||false;
  if(localRunning){
    localStartedAt=performance.now()-localElapsed*1000;
  }

  // Hide offline banner if we were offline
  $('offlineBanner').classList.remove('show');
  $('clock').classList.remove('offline');

  renderFull(s, localElapsed);
}

/* ══════════════════════════════════════
   LOCAL CLOCK LOOP — runs even offline
══════════════════════════════════════ */
(function loop(){
  let t=localElapsed;
  if(localRunning && localStartedAt!==null){
    t=(performance.now()-localStartedAt)/1000;
    localElapsed=t;
  }

  // Update clock display
  $('clock').textContent=fmt(t);

  // Update countdown smoothly
  if(lastState && lastState.nextCue){
    const diff=lastState.nextCue.time-t;
    const cdEl=$('countdown');
    if(diff>0){
      const mm=Math.floor(diff/60),ss=Math.floor(diff%60);
      cdEl.textContent=mm>0?`${mm}:${pad(ss)}`:`${Math.ceil(diff)}s`;
      cdEl.className='cc-countdown'+(diff<=5?' hot':'');
    } else {
      cdEl.textContent='NU';
      cdEl.className='cc-countdown hot';
    }
    // Progress bar
    const prev=lastState.prevCueTime||0;
    const span=lastState.nextCue.time-prev;
    const done=t-prev;
    const pct=Math.min(100,Math.max(0,span>0?done/span*100:0));
    $('progressFill').style.width=pct+'%';
    $('progressFill').style.background=diff<=10?'var(--danger)':'var(--warn)';
  }

  requestAnimationFrame(loop);
})();

/* ══════════════════════════════════════
   RENDER
══════════════════════════════════════ */
function renderFull(s, t){
  // Clock class
  const clk=$('clock');
  clk.className=s.running?'run':'pau';

  // Status badge
  const sb=$('statusBadge');
  sb.textContent=s.running?'LIVE':'GEPAUZEERD';
  sb.className='status-badge'+(s.running?' live':' pau');

  // Active cue
  if(s.activeCue){
    $('activeName').textContent=s.activeCue.name;
    $('activeDot').style.background=TC[s.activeCue.type||'none'];
  } else {
    $('activeName').textContent='—';
    $('activeDot').style.background=TC.none;
  }

  // Next cue
  if(s.nextCue){
    $('nextName').textContent=s.nextCue.name;
    $('nextTime').textContent=fmt(s.nextCue.time);
    $('nextDot').style.background=TC[s.nextCue.type||'none'];
  } else {
    $('nextName').textContent='Einde show';
    $('nextTime').textContent='';
    $('nextDot').style.background=TC.none;
    $('countdown').textContent='—';
  }

  // Region
  const regs=s.regions||[];
  if(s.region){
    $('rdName').textContent=s.region.name;
    const idx=regs.findIndex(r=>r.id===s.region.id);
    const nxt=regs[idx+1];
    if(nxt){
      const diff=nxt.start-t;
      const mm=Math.floor(diff/60),ss=Math.floor(diff%60);
      $('rdNext').textContent=`→ ${nxt.name}  ${mm}:${pad(ss)}`;
    } else $('rdNext').textContent='Laatste deel';
  } else {
    $('rdName').textContent='—';
    $('rdNext').textContent='';
  }

  renderRegions(s,t);
  renderCues(s,t);
}

function renderRegions(s,t){
  const el=$('regionsList');
  const regs=s.regions||[];
  if(!regs.length){el.innerHTML='<div style="padding:16px;font-size:12px;color:var(--muted)">Geen delen</div>';return;}
  el.innerHTML=regs.map(r=>{
    const isAct=s.region&&s.region.id===r.id;
    const isPast=t>=r.end;
    const bc=r.color||'var(--muted)';
    let pct=0;
    if(isAct) pct=Math.min(100,Math.max(0,(t-r.start)/(r.end-r.start)*100));
    else if(isPast) pct=100;
    return `<div class="region-row ${isAct?'active':''} ${isPast&&!isAct?'past':''}">
      <div class="rr-bar" style="background:${bc}"></div>
      <div class="rr-body">
        <div class="rr-name ${isAct?'active':''}">${r.name}</div>
        <div class="rr-time">${fmt(r.start)} – ${fmt(r.end)}</div>
        <div class="rr-prog"><div class="rr-prog-fill" style="width:${pct}%"></div></div>
      </div>
    </div>`;
  }).join('');
}

function renderCues(s,t){
  const el=$('cueList');
  const cues=s.cues||[];
  if(!cues.length){el.innerHTML='<div style="padding:16px;font-size:12px;color:var(--muted)">Geen cues</div>';return;}

  let html='',lastRid='__';
  for(let i=0;i<cues.length;i++){
    const c=cues[i];
    // Region separator
    if(c.regionId!==lastRid){
      lastRid=c.regionId;
      const r=(s.regions||[]).find(x=>x.id===c.regionId);
      if(r){
        html+=`<div style="display:flex;align-items:center;gap:8px;padding:4px 14px;background:var(--s1);border-bottom:1px solid var(--bdr);border-left:3px solid ${r.color||'var(--muted)'};">
          <span style="font-size:9px;color:var(--muted);font-weight:800;">${r.id}</span>
          <span style="font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:1.5px;">${r.name}</span>
        </div>`;
      }
    }
    const isAct=s.activeCue&&c.name===s.activeCue.name;
    const isNext=s.nextCue&&c.name===s.nextCue.name;
    const isPast=c.time<t&&!isAct&&!isNext;
    let cls=isAct?'active':isNext?'upcoming':isPast?'past':'';
    html+=`<div class="cue-row ${cls}" id="vcue-${i}">
      <div class="cr-dot" style="background:${TC[c.type||'none']}"></div>
      <div class="cr-name ${isAct?'active':''}">${c.name}</div>
      <div class="cr-time">${fmt(c.time)}</div>
    </div>`;
  }
  el.innerHTML=html;

  // Auto-scroll
  const target=document.querySelector('.cue-row.upcoming,.cue-row.active');
  if(target) target.scrollIntoView({block:'nearest'});
}

/* ══════════════════════════════════════
   START
══════════════════════════════════════ */
connect();
</script>
</body>
</html>
