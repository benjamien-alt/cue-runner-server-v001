<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>CUE RUNNER — Viewer</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Bebas+Neue&family=DM+Sans:wght@600;700;800&display=swap');

:root {
  --bg:     #080809;
  --s1:     #0f0f13;
  --s2:     #15151c;
  --bdr:    #2a2a3a;
  --acc:    #c8f53a;
  --warn:   #f5a623;
  --danger: #f53a3a;
  --text:   #f0f0fa;
  --muted:  #9090b0;
  --regie:  #c4affe;
  --kraan:  #7dd8fc;
  --licht:  #fcd34d;
  --geluid: #6ee7b7;
}
* { box-sizing:border-box; margin:0; padding:0; }
html,body { background:var(--bg); color:var(--text); font-family:'DM Sans',sans-serif; min-height:100vh; }

/* ── CONNECTION BAR ── */
.conn-bar {
  display:flex; align-items:center; justify-content:space-between;
  padding:10px 16px; background:var(--s1); border-bottom:1px solid var(--bdr);
}
.conn-left { display:flex; align-items:center; gap:10px; }
.logo { font-family:'Bebas Neue',sans-serif; font-size:18px; letter-spacing:4px; color:var(--acc); }
.conn-dot { width:8px; height:8px; border-radius:50%; background:var(--muted); transition:background .3s; }
.conn-dot.live { background:var(--acc); box-shadow:0 0 8px var(--acc); animation:blink 1s infinite; }
.conn-dot.error { background:var(--danger); }
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.conn-label { font-size:11px; letter-spacing:1.5px; color:var(--muted); text-transform:uppercase; }
.conn-form { display:flex; gap:8px; align-items:center; }
.conn-input {
  background:var(--s2); border:1px solid var(--bdr); border-radius:6px;
  padding:6px 10px; color:var(--text); font-family:'DM Sans',sans-serif;
  font-size:12px; outline:none; width:220px;
}
.conn-input:focus { border-color:var(--acc); }
.conn-btn {
  background:var(--acc); color:#080809; border:none; border-radius:6px;
  padding:6px 14px; font-family:'DM Sans',sans-serif; font-size:12px; font-weight:800;
  cursor:pointer; white-space:nowrap;
}
.conn-btn:hover { filter:brightness(1.1); }
.badge-viewer {
  font-size:9px; letter-spacing:2px; color:var(--muted); text-transform:uppercase;
  padding:3px 8px; border:1px solid var(--bdr); border-radius:4px;
}

/* ── MAIN LAYOUT ── */
.main { display:grid; grid-template-columns:1fr; gap:0; max-width:1200px; margin:0 auto; }
@media(min-width:700px){ .main{ grid-template-columns:1fr 1fr; } }
@media(min-width:1100px){ .main{ grid-template-columns:220px 1fr 1fr; } }

/* ── CLOCK HERO ── */
.clock-section {
  grid-column:1/-1;
  padding:20px 20px 16px; background:var(--s1); border-bottom:1px solid var(--bdr);
  display:flex; align-items:center; gap:20px; flex-wrap:wrap;
}
.clock-group { display:flex; flex-direction:column; gap:2px; }
.clock-lbl { font-size:9px; letter-spacing:3px; color:var(--muted); text-transform:uppercase; font-weight:800; }
#clock {
  font-family:'Share Tech Mono',monospace; font-size:clamp(48px,8vw,80px);
  color:var(--acc); letter-spacing:3px; line-height:1;
  text-shadow:0 0 30px rgba(200,245,58,.35); transition:color .3s;
}
#clock.run { color:#fff; text-shadow:0 0 40px rgba(200,245,58,.55); }
#clock.pau { color:var(--warn); }

.status-badge {
  font-size:11px; letter-spacing:2px; text-transform:uppercase; font-weight:800;
  padding:5px 12px; border-radius:6px; background:var(--s2); color:var(--muted); border:1px solid var(--bdr);
}
.status-badge.live { background:rgba(200,245,58,.12); color:var(--acc); border-color:var(--acc); }
.status-badge.pau  { background:rgba(245,166,35,.12); color:var(--warn); border-color:var(--warn); }

.region-display {
  flex:1; min-width:200px;
  display:flex; flex-direction:column; gap:4px;
  padding:10px 16px; background:var(--s2); border-radius:8px; border:1px solid var(--bdr);
}
.rd-label { font-size:9px; letter-spacing:2px; color:var(--muted); text-transform:uppercase; font-weight:800; }
.rd-name { font-family:'Bebas Neue',sans-serif; font-size:22px; letter-spacing:2px; color:var(--text); line-height:1; }
.rd-next { font-size:11px; color:var(--muted); }

/* ── ACTIVE / NEXT CUE ── */
.cue-cards { grid-column:1/-1; display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--bdr); }
@media(min-width:1100px){ .cue-cards{ grid-column:2/3; grid-row:2; } }

.cue-card {
  background:var(--s1); padding:18px 20px;
  display:flex; flex-direction:column; gap:6px;
}
.cc-label { font-size:9px; letter-spacing:2px; color:var(--muted); text-transform:uppercase; font-weight:800; }
.cc-type { display:flex; align-items:center; gap:6px; }
.cc-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.cc-name {
  font-family:'Bebas Neue',sans-serif; font-size:clamp(20px,3vw,28px); letter-spacing:1.5px;
  line-height:1.1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.cc-name.active { color:var(--acc); }
.cc-name.next   { color:var(--warn); }
.cc-time { font-family:'Share Tech Mono',monospace; font-size:13px; color:var(--muted); }
.cc-countdown { font-family:'Share Tech Mono',monospace; font-size:24px; color:var(--warn); }
.cc-countdown.hot { color:var(--danger); animation:pulse .5s infinite alternate; }
@keyframes pulse{from{opacity:1}to{opacity:.2}}
.progress-bar { height:3px; background:var(--bdr); border-radius:2px; overflow:hidden; margin-top:4px; }
.progress-fill { height:100%; background:var(--warn); width:0%; transition:width .4s linear; }

/* ── REGIONS SIDEBAR ── */
.regions-col {
  grid-column:1/-1; background:var(--s1); border-top:1px solid var(--bdr);
}
@media(min-width:1100px){
  .regions-col{ grid-column:1/2; grid-row:2/4; border-top:none; border-right:1px solid var(--bdr); }
}
.regions-header { padding:10px 16px; border-bottom:1px solid var(--bdr); }
.regions-title { font-size:9px; letter-spacing:3px; color:var(--muted); text-transform:uppercase; font-weight:800; }
.region-row {
  display:flex; align-items:center; gap:8px; padding:8px 16px;
  border-bottom:1px solid var(--bdr); border-left:3px solid transparent;
}
.region-row.active { background:rgba(200,245,58,.05); border-left-color:var(--acc); }
.region-row.past   { opacity:.35; }
.rr-bar { width:4px; height:28px; border-radius:2px; flex-shrink:0; }
.rr-body { flex:1; min-width:0; }
.rr-name { font-family:'Bebas Neue',sans-serif; font-size:14px; letter-spacing:1.5px; color:var(--text); }
.rr-name.active { color:var(--acc); }
.rr-time { font-family:'Share Tech Mono',monospace; font-size:9px; color:var(--muted); margin-top:1px; }
.rr-prog { height:2px; background:var(--bdr); border-radius:1px; margin-top:3px; overflow:hidden; }
.rr-prog-fill { height:100%; background:var(--acc); transition:width .5s linear; }

/* ── CUE LIST ── */
.cuelist-col {
  grid-column:1/-1; background:var(--bg); overflow:hidden;
}
@media(min-width:1100px){ .cuelist-col{ grid-column:3/4; grid-row:2/4; border-left:1px solid var(--bdr); } }
.cuelist-header { padding:10px 16px; border-bottom:1px solid var(--bdr); background:var(--s1); position:sticky; top:0; }
.cuelist-title { font-size:9px; letter-spacing:3px; color:var(--muted); text-transform:uppercase; font-weight:800; }
.cue-row {
  display:flex; align-items:center; gap:8px; padding:9px 16px;
  border-bottom:1px solid var(--bdr); border-left:3px solid transparent;
  font-size:13px;
}
.cue-row.active  { background:rgba(200,245,58,.05); border-left-color:var(--acc); }
.cue-row.upcoming{ background:rgba(245,166,35,.04); border-left-color:var(--warn); }
.cue-row.past    { opacity:.3; }
.cr-dot { width:7px; height:7px; border-radius:50%; flex-shrink:0; }
.cr-name { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.cr-name.active { color:var(--acc); font-weight:700; }
.cr-time { font-family:'Share Tech Mono',monospace; font-size:11px; color:var(--muted); }

/* ── DISCONNECTED OVERLAY ── */
.overlay {
  position:fixed; inset:0; background:rgba(8,8,9,.9);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:16px; z-index:100;
}
.overlay.hidden { display:none; }
.overlay-icon { font-size:48px; }
.overlay-text { font-size:14px; color:var(--muted); text-align:center; line-height:1.8; }
.overlay-url  { font-family:'Share Tech Mono',monospace; font-size:12px; color:var(--acc); margin-top:4px; }
</style>
</head>
<body>

<!-- DISCONNECTED OVERLAY -->
<div class="overlay" id="overlay">
  <div class="overlay-icon">📡</div>
  <div class="overlay-text">
    Verbinding maken met de Cue Runner server…<br>
    <span id="overlayUrl" class="overlay-url"></span>
  </div>
</div>

<!-- CONNECTION BAR -->
<div class="conn-bar">
  <div class="conn-left">
    <div class="logo">CUE RUNNER</div>
    <div class="conn-dot" id="connDot"></div>
    <div class="conn-label" id="connLabel">Geen verbinding</div>
    <span class="badge-viewer">VIEWER — alleen lezen</span>
  </div>
  <div class="conn-form">
    <input class="conn-input" id="serverUrl" type="text" placeholder="ws://192.168.1.x:3001" value="">
    <button class="conn-btn" onclick="connect()">Verbinden</button>
  </div>
</div>

<!-- MAIN CONTENT -->
<div class="main">

  <!-- CLOCK HERO -->
  <div class="clock-section">
    <div class="clock-group">
      <div class="clock-lbl">Timecode</div>
      <div id="clock">00:00:00</div>
    </div>
    <div class="status-badge" id="statusBadge">GESTOPT</div>
    <div class="region-display">
      <div class="rd-label">Huidig deel</div>
      <div class="rd-name" id="rdName">—</div>
      <div class="rd-next" id="rdNext"></div>
    </div>
  </div>

  <!-- CUE CARDS -->
  <div class="cue-cards">
    <div class="cue-card">
      <div class="cc-label">Nu actief</div>
      <div class="cc-type"><div class="cc-dot" id="activeDot"></div></div>
      <div class="cc-name active" id="activeName">—</div>
      <div class="cc-time" id="activeTime"></div>
    </div>
    <div class="cue-card">
      <div class="cc-label">Volgende</div>
      <div class="cc-type"><div class="cc-dot" id="nextDot"></div></div>
      <div class="cc-name next" id="nextName">—</div>
      <div class="cc-time" id="nextTime"></div>
      <div class="cc-countdown" id="countdown">—</div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    </div>
  </div>

  <!-- REGIONS -->
  <div class="regions-col">
    <div class="regions-header"><div class="regions-title">Delen</div></div>
    <div id="regionsList"></div>
  </div>

  <!-- CUE LIST -->
  <div class="cuelist-col">
    <div class="cuelist-header"><div class="cuelist-title">Cuelijst</div></div>
    <div id="cueList"></div>
  </div>

</div>

<script>
const TYPE_COL={regie:'#c4affe',kraan:'#7dd8fc',licht:'#fcd34d',geluid:'#6ee7b7',none:'#5a5a78'};
const pad=n=>String(n).padStart(2,'0');
const fmt=s=>`${pad(Math.floor(s/3600))}:${pad(Math.floor((s%3600)/60))}:${pad(Math.floor(s%60))}`;

let ws=null, state=null, lastServerT=0, lastReceivedAt=0;
let pingInterval=null;

// ── Auto-read server URL from query param: ?server=wss://...
(function(){
  const u=new URLSearchParams(location.search).get('server');
  if(u){ document.getElementById('serverUrl').value=u; connect(); }
})();

function connect(){
  const url=document.getElementById('serverUrl').value.trim();
  if(!url)return;
  $('overlayUrl').textContent=url;
  if(ws){ try{ws.close();}catch(e){} }
  if(pingInterval){ clearInterval(pingInterval); pingInterval=null; }

  try {
    ws=new WebSocket(url);
  } catch(e) {
    setConn(false);
    setTimeout(connect, 5000);
    return;
  }

  ws.onopen=()=>{
    setConn(true);
    $('overlay').classList.add('hidden');
    // Keepalive: send __ping__ every 20s so Render doesn't drop the connection
    pingInterval=setInterval(()=>{
      if(ws&&ws.readyState===WebSocket.OPEN){
        try{ ws.send('__ping__'); }catch(e){}
      }
    }, 20000);
  };

  ws.onclose=()=>{
    setConn(false);
    $('overlay').classList.remove('hidden');
    if(pingInterval){ clearInterval(pingInterval); pingInterval=null; }
    setTimeout(connect, 3000);
  };

  ws.onerror=()=>{ setConn(false); };

  ws.onmessage=e=>{
    // Ignore pong responses and non-JSON
    if(e.data==='__pong__') return;
    try{
      const parsed=JSON.parse(e.data);
      // Handle broadcaster disconnect notification
      if(parsed.disconnected){
        setConn(true); // still connected to server
        // Show broadcaster offline state
        const sb=$('statusBadge');
        sb.textContent='BROADCASTER WEG';
        sb.className='status-badge';
        return;
      }
      state=parsed;
      lastServerT=state.t||0;
      lastReceivedAt=performance.now();
      render(state);
    }catch(err){}
  };
}

function setConn(ok){
  const dot=$('connDot'), lbl=$('connLabel');
  dot.className='conn-dot'+(ok?' live':'');
  lbl.textContent=ok?'Verbonden':'Geen verbinding';
}

// ── Smooth clock interpolation between server packets
(function clockLoop(){
  if(state&&state.running){
    const sinceLast=(performance.now()-lastReceivedAt)/1000;
    const interp=lastServerT+sinceLast;
    $('clock').textContent=fmt(interp);

    // Update countdown smoothly
    if(state.nextCue){
      const diff=state.nextCue.time-interp;
      const mm=Math.floor(diff/60),ss=Math.floor(diff%60);
      const cdEl=$('countdown');
      if(diff>0){
        cdEl.textContent=mm>0?`${mm}:${pad(ss)}`:`${Math.ceil(diff)}s`;
        cdEl.className='cc-countdown'+(diff<=5?' hot':'');
      }
      // progress bar
      const prev=state.prevCueTime||0;
      const span=state.nextCue.time-prev;
      const done=interp-prev;
      const pct=Math.min(100,Math.max(0,done/span*100));
      $('progressFill').style.width=pct+'%';
      $('progressFill').style.background=diff<=10?'var(--danger)':'var(--warn)';
    }
  }
  requestAnimationFrame(clockLoop);
})();

function render(s){
  // Clock
  $('clock').textContent=fmt(s.t);
  $('clock').className=s.running?'run':'pau';

  // Status
  const sb=$('statusBadge');
  sb.textContent=s.running?'LIVE':'GEPAUZEERD';
  sb.className='status-badge'+(s.running?' live':' pau');

  // Active cue
  if(s.activeCue){
    $('activeName').textContent=s.activeCue.name;
    $('activeDot').style.background=TYPE_COL[s.activeCue.type||'none'];
  } else {
    $('activeName').textContent='—';
    $('activeDot').style.background=TYPE_COL.none;
  }

  // Next cue
  if(s.nextCue){
    $('nextName').textContent=s.nextCue.name;
    $('nextTime').textContent=fmt(s.nextCue.time);
    $('nextDot').style.background=TYPE_COL[s.nextCue.type||'none'];
  } else {
    $('nextName').textContent='Einde show';
    $('nextTime').textContent='';
    $('nextDot').style.background=TYPE_COL.none;
    $('countdown').textContent='—';
  }

  // Region
  if(s.region){
    $('rdName').textContent=s.region.name;
    const idx=(s.regions||[]).findIndex(r=>r.id===s.region.id);
    const nxt=(s.regions||[])[idx+1];
    if(nxt){
      const diff=nxt.start-s.t;
      const mm=Math.floor(diff/60),ss=Math.floor(diff%60);
      $('rdNext').textContent=`→ ${nxt.name}  ${mm}:${pad(ss)}`;
    } else {
      $('rdNext').textContent='Laatste deel';
    }
  } else {
    $('rdName').textContent='—';
    $('rdNext').textContent='';
  }

  // Regions list
  renderRegions(s);
  // Cue list
  renderCues(s);
}

function renderRegions(s){
  const list=$('regionsList');
  const regs=s.regions||[];
  if(!regs.length){list.innerHTML='<div style="padding:20px 16px;font-size:12px;color:var(--muted)">Geen delen</div>';return;}
  list.innerHTML=regs.map(r=>{
    const isActive=s.region&&s.region.id===r.id;
    const isPast=s.t>=r.end;
    const bc=r.color||'var(--muted)';
    let pct=0;
    if(isActive)pct=Math.min(100,Math.max(0,(s.t-r.start)/(r.end-r.start)*100));
    else if(isPast)pct=100;
    return `<div class="region-row ${isActive?'active':''} ${isPast&&!isActive?'past':''}">
      <div class="rr-bar" style="background:${bc}"></div>
      <div class="rr-body">
        <div class="rr-name ${isActive?'active':''}">${r.name}</div>
        <div class="rr-time">${fmt(r.start)} – ${fmt(r.end)}</div>
        <div class="rr-prog"><div class="rr-prog-fill" style="width:${pct}%"></div></div>
      </div>
    </div>`;
  }).join('');
}

function renderCues(s){
  const list=$('cueList');
  const cues=s.cues||[];
  const activeIdx=s.activeCue?cues.findIndex(c=>s.activeCue&&c.name===s.activeCue.name&&Math.abs(c.time-(s.t-(s.t%1))<2)):- 1;
  const nextIdx=s.nextCue?cues.findIndex(c=>s.nextCue&&c.name===s.nextCue.name):- 1;

  if(!cues.length){list.innerHTML='<div style="padding:20px 16px;font-size:12px;color:var(--muted)">Geen cues</div>';return;}

  let html='', lastRid='__';
  for(let i=0;i<cues.length;i++){
    const c=cues[i];
    if(c.regionId!==lastRid){
      lastRid=c.regionId;
      const r=(s.regions||[]).find(x=>x.id===c.regionId);
      if(r){
        const bc=r.color||'var(--muted)';
        html+=`<div style="display:flex;align-items:center;gap:8px;padding:5px 16px;background:var(--s1);border-bottom:1px solid var(--bdr);border-left:3px solid ${bc};">
          <span style="font-size:9px;letter-spacing:1px;color:var(--muted);font-weight:800;">${r.id}</span>
          <span style="font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:1.5px;color:var(--text);">${r.name}</span>
        </div>`;
      }
    }
    let cls='';
    const isPast=c.time<s.t&&i!==nextIdx;
    if(i===nextIdx) cls='upcoming';
    else if(s.activeCue&&c.name===s.activeCue.name) cls='active';
    else if(isPast) cls='past';
    html+=`<div class="cue-row ${cls}" id="vcue-${i}">
      <div class="cr-dot" style="background:${TYPE_COL[c.type||'none']}"></div>
      <div class="cr-name ${cls==='active'?'active':''}">${c.name}</div>
      <div class="cr-time">${fmt(c.time)}</div>
    </div>`;
  }
  list.innerHTML=html;

  // Auto-scroll to active/next
  const target=nextIdx>=0?`vcue-${nextIdx}`:activeIdx>=0?`vcue-${activeIdx}`:null;
  if(target){const el=$(target);if(el)el.scrollIntoView({block:'nearest'});}
}

const $=id=>document.getElementById(id);
</script>
</body>
</html>
